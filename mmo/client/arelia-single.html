<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arelia Online — Single HTML</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui,sans-serif}#app{width:min(1120px,100%);margin:auto;padding:10px}header{display:flex;justify-content:space-between;padding:8px 4px;color:#ffd166}#connection{color:#ff9b9b;font-size:13px}main{position:relative;border:2px solid #35415b;border-radius:12px;overflow:hidden;background:#111827}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}#hud{position:absolute;left:10px;top:10px;width:240px;background:#07101ddd;padding:10px;border:1px solid #526079;border-radius:9px;font-size:12px;line-height:1.7}#character{font-weight:700;color:#ffd166}.bar{height:7px;background:#273044;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#e85d75}.bar i#mpbar{background:#4cc9f0}#help{position:absolute;bottom:7px;left:10px;right:10px;background:#07101dcc;padding:6px;border-radius:6px;font-size:11px;color:#c7cfde}
</style>
</head>
<body><div id="app"><header><b>ARELIA ONLINE</b><span id="connection">● Single HTML Trial</span></header><main><canvas id="game" width="1100" height="680"></canvas><aside id="hud"><div id="character">Adventurer · Warrior · Lv.1</div><div>HP <span id="hp">100/100</span></div><div class="bar"><i id="hpbar"></i></div><div>MP <span id="mp">50/50</span></div><div class="bar"><i id="mpbar"></i></div><div>Gold <span id="gold">100</span> · EXP <span id="xp">0/100</span></div></aside><div id="help">WASD/ลูกศร เดิน · SPACE โจมตี</div></main></div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),keys={};
const player={x:1600,y:1250,r:15,speed:180,hp:100,maxHp:100,mp:50,maxMp:50,gold:100,xp:0,level:1,name:'Adventurer',class:'Warrior'};
const zone={name:'Emerald Vales',width:3200,height:2400,spawn:{x:1600,y:1250},terrain:{base:'grass',regions:[
{id:'north-forest',type:'forest',x:0,y:0,w:1100,h:760},{id:'central-meadow',type:'grass',x:800,y:520,w:1500,h:1100},{id:'west-meadow',type:'grass',x:0,y:760,w:950,h:950},{id:'east-forest',type:'forest',x:2250,y:500,w:950,h:1250},{id:'south-meadow',type:'grass',x:450,y:1550,w:2350,h:850},{id:'southwest-wetland',type:'swamp',x:0,y:1650,w:650,h:750}]},
water:[{type:'river',points:[[120,430],[520,560],[820,760],[1120,940],[1460,1040],[1780,1220],[2070,1460],[2380,1660],[2790,1830],[3180,1950]]},{type:'pond',x:260,y:1940,w:360,h:250},{type:'pond',x:2420,y:820,w:300,h:210}],
roads:[{points:[[1600,1250],[1500,950],[1350,720],[1160,520]]},{points:[[1600,1250],[1280,1280],[930,1330],[600,1320],[280,1160]]},{points:[[1600,1250],[1640,1450],[1600,1720],[1510,2040],[1460,2320]]},{points:[[1600,1250],[1900,1150],[2180,1120],[2490,1180],[2850,1300]]}],
bridges:[{x:1510,y:1120,w:190,h:70},{x:2300,y:1570,w:180,h:70}],
structures:[{x:1450,y:1030,w:150,h:110},{x:1660,y:1035,w:150,h:110},{x:1450,y:1260,w:150,h:110},{x:1660,y:1265,w:150,h:110},{x:520,y:1180,w:130,h:100},{x:2670,y:1120,w:130,h:100}],
movement:{grassMultiplier:1,forestMultiplier:.85,swampMultiplier:.65,waterMultiplier:.45,roadMultiplier:1.15,bridgeMultiplier:1}};
const img={oak:new Image(),pine:new Image(),rock:new Image(),house:new Image()};
img.oak.src='https://raw.githubusercontent.com/tpoooym-glitch/mmorpg/main/mmo/client/assets/forest/oak-large.webp';
img.pine.src='https://raw.githubusercontent.com/tpoooym-glitch/mmorpg/main/mmo/client/assets/forest/pine-large.webp';
img.rock.src='https://raw.githubusercontent.com/tpoooym-glitch/mmorpg/main/mmo/client/assets/forest/rock-large.webp';
img.house.src='https://raw.githubusercontent.com/tpoooym-glitch/mmorpg/main/mmo/client/assets/buildings/house-red.webp';
let decor=[],mobs=[],cam={x:0,y:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b,c,d)=>Math.hypot(a-c,b-d),inRect=(x,y,r)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
function nearLine(x,y,p,r){for(let i=1;i<p.length;i++){const[a,b]=p[i-1],[c,d]=p[i],abx=c-a,aby=d-b,t=clamp(((x-a)*abx+(y-b)*aby)/(abx*abx+aby*aby||1),0,1);if(dist(x,y,a+t*abx,b+t*aby)<=r)return true}return false}
function terrain(x,y){if(zone.bridges.some(b=>inRect(x,y,b)))return'bridge';if(zone.water.some(w=>w.type==='pond'&&inRect(x,y,w)))return'water';if(zone.water.some(w=>w.type==='river'&&nearLine(x,y,w.points,42)))return'water';if(zone.roads.some(r=>nearLine(x,y,r.points,34)))return'road';for(let i=zone.terrain.regions.length-1;i>=0;i--){const r=zone.terrain.regions[i];if(inRect(x,y,r))return r.type}return'grass'}
function blocked(x,y){if(x<player.r||y<player.r||x>zone.width-player.r||y>zone.height-player.r)return true;if(zone.bridges.some(b=>inRect(x,y,b)))return false;if(zone.structures.some(s=>inRect(x,y,{x:s.x-16,y:s.y-16,w:s.w+32,h:s.h+32})))return true;return decor.some(o=>o.blocked&&dist(x,y,o.x,o.y)<o.r+player.r)}
function speed(){const t=terrain(player.x,player.y);return player.speed*(zone.movement[t+'Multiplier']??1)}
function move(dt){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(x&&y){x*=.707;y*=.707}const s=speed(),nx=player.x+x*s*dt,ny=player.y+y*s*dt;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny}
function attack(){for(const m of mobs)if(m.hp>0&&dist(m.x,m.y,player.x,player.y)<78){m.hp-=20;if(m.hp<=0){player.xp+=20;player.gold+=5;if(player.xp>=100){player.xp-=100;player.level++;player.maxHp+=10;player.hp=player.maxHp}}}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();attack()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function makeDecor(){decor=[];let seed=8731;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(const r of zone.terrain.regions.filter(r=>r.type==='forest')){let count=Math.max(24,Math.floor(r.w*r.h/18000));for(let n=0;n<count;n++){for(let tries=0;tries<30;tries++){const x=r.x+30+rand()*(r.w-60),y=r.y+35+rand()*(r.h-70);if(terrain(x,y)!=='forest'||dist(x,y,player.x,player.y)<170||zone.structures.some(s=>inRect(x,y,{x:s.x-70,y:s.y-70,w:s.w+140,h:s.h+140}))||zone.roads.some(q=>nearLine(x,y,q.points,70))||decor.some(o=>dist(x,y,o.x,o.y)<70))continue;const type=rand()<.52?'oak':'pine';decor.push({x,y,type,blocked:true,r:type==='oak'?30:25,w:type==='oak'?105:82,h:type==='oak'?125:118});break}}}for(let n=0;n<26;n++){const x=40+rand()*(zone.width-80),y=40+rand()*(zone.height-80);if(terrain(x,y)==='forest'&&!decor.some(o=>dist(x,y,o.x,o.y)<55))decor.push({x,y,type:'rock',blocked:true,r:24,w:50,h:45})}}
function line(points,w,a,b){ctx.beginPath();points.forEach((p,i)=>{const x=p[0]-cam.x,y=p[1]-cam.y;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=w;ctx.strokeStyle=a;ctx.stroke();ctx.lineWidth=Math.max(2,w-14);ctx.strokeStyle=b;ctx.stroke()}
function drawDecor(){for(const o of decor){const i=img[o.type],x=o.x-cam.x,y=o.y-cam.y;if(!i.complete||!i.naturalWidth||x<-o.w||y<-o.h||x>canvas.width+o.w||y>canvas.height+o.h)continue;ctx.drawImage(i,x-o.w/2,y-o.h,o.w,o.h)}}
function drawStructures(){for(const s of zone.structures){const i=img.house;if(!i.complete||!i.naturalWidth)continue;const sw=145,sh=170,x=s.x+s.w/2-sw/2-cam.x,y=s.y+s.h-sh+10-cam.y;if(x>-sw&&y>-sh&&x<canvas.width+sw&&y<canvas.height+sh)ctx.drawImage(i,x,y,sw,sh)}}
function draw(){cam.x=clamp(player.x-canvas.width/2,0,zone.width-canvas.width);cam.y=clamp(player.y-canvas.height/2,0,zone.height-canvas.height);ctx.fillStyle='#79a84a';ctx.fillRect(0,0,canvas.width,canvas.height);const c={grass:'#79a84a',forest:'#3f713e',swamp:'#607b52'};for(const r of zone.terrain.regions){ctx.fillStyle=c[r.type]||c.grass;ctx.fillRect(r.x-cam.x,r.y-cam.y,r.w,r.h)}for(const w of zone.water){if(w.type==='river')line(w.points,94,'#356b75','#5da9b7');else{ctx.fillStyle='#5da9b7';ctx.beginPath();ctx.ellipse(w.x+w.w/2-cam.x,w.y+w.h/2-cam.y,w.w/2,w.h/2,0,0,Math.PI*2);ctx.fill()}}for(const r of zone.roads)line(r.points,64,'#b88752','#d6a66c');for(const b of zone.bridges){ctx.fillStyle='#795548';ctx.fillRect(b.x-cam.x,b.y-cam.y,b.w,b.h)}drawDecor();drawStructures();for(const m of mobs){if(m.hp<=0)continue;const x=m.x-cam.x,y=m.y-cam.y;ctx.fillStyle='#86b84d';ctx.beginPath();ctx.arc(x,y,m.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ef4444';ctx.fillRect(x-15,y-25,30*m.hp/m.maxHp,4)}const px=player.x-cam.x,py=player.y-cam.y;ctx.fillStyle='#f4c2a1';ctx.beginPath();ctx.arc(px,py,player.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText(player.name,px-35,py-24);ctx.font='bold 18px system-ui';ctx.fillText(zone.name,18,28)}
function ui(){document.querySelector('#character').textContent=`${player.name} · ${player.class} · Lv.${player.level}`;document.querySelector('#hp').textContent=`${Math.round(player.hp)}/${player.maxHp}`;document.querySelector('#mp').textContent=`${player.mp}/${player.maxMp}`;document.querySelector('#gold').textContent=player.gold;document.querySelector('#xp').textContent=`${player.xp}/100`;document.querySelector('#hpbar').style.width=`${player.hp/player.maxHp*100}%`;document.querySelector('#mpbar').style.width=`${player.mp/player.maxMp*100}%`}
mobs=[[420,520],[680,840],[900,520],[1120,1450],[1380,1560],[1900,760],[2140,1380],[2480,720],[2720,1460],[2900,1720]].map((p,i)=>({x:p[0],y:p[1],r:16,hp:40,maxHp:40}));makeDecor();let last=performance.now();function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;move(dt);draw();ui();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
